Absolutely. Let's start **from zero** and do only the two sections you want.

This time we'll use a GitHub Action that generates the SVG **inside your own repository**, so there is no `vercel.app` image dependency. The current action documentation confirms that `contributions` provides the streak + 12-month contribution calendar, while `lifetime` provides contribution history. ([GitHub][1])

# Step 1 — Open your profile repository

Go to:

[Your GitHub Profile Repository](https://github.com/mayurunagar5/mayurunagar5?utm_source=chatgpt.com)

It should be:

```text
mayurunagar5 / mayurunagar5
```

Your `README.md` should already be there.

---

# Step 2 — Create the workflow folder

Inside that repository:

**Add file → Create new file**

For the filename, enter:

```text
.github/workflows/profile-stats.yml
```

GitHub will automatically create the folders.

---

# Step 3 — Paste this EXACT code

Delete anything currently inside that file and paste:

```yaml
name: Update GitHub Profile Stats

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Generate profile cards
        uses: seijikohara/profile-cards-action@v0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          username: mayurunagar5
          cards: contributions,lifetime
          output-dir: profile
          themes: dark
          commit: true
```

**Don't change `GITHUB_TOKEN`.**

The action documentation specifically requires `github-token`, and `contents: write` allows the workflow to commit the generated SVG files back to the repository. ([GitHub][1])

---

# Step 4 — Commit the workflow

Scroll down.

Click:

**Commit changes**

Then:

**Commit directly to the `main` branch**

Click **Commit changes**.

---

# Step 5 — Open Actions

At the top of your repository, click:

**Actions**

You should see:

**Update GitHub Profile Stats**

Click it.

---

# Step 6 — Run it manually

On the right side, click:

**Run workflow**

Then click the green:

**Run workflow**

button.

Wait for it to finish.

You want to see:

```text
✓ Update GitHub Profile Stats
```

not:

```text
✕ Update GitHub Profile Stats
```

---

# Step 7 — Check your repository

Go back to the main repository page.

You should now see a new folder:

```text
profile
```

Open it.

You should have:

```text
profile/
├── contributions.dark.svg
└── lifetime.dark.svg
```

The action generates files using the format:

```text
<card>.<theme>.svg
```

so these filenames are expected. ([GitHub][1])

