### What each one does

**Contribution Streak**

The `contributions` card contains your **current streak, longest streak, and trailing 12-month contribution calendar**. ([GitHub][1])

**Contribution Graph**

The `lifetime` card displays your **contribution history by year**. ([GitHub][1])

And the Action automatically regenerates the SVG on the schedule you specified. ([GitHub][1])

